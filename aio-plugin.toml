[plugin.runtime]
kind = "wasm-component"
artifact = "dist/plugin.wasm"

[plugin.marketplace]
title = "TypeScript Wasm Component"
summary = "Component 模型编译的 TypeScript 计数页面与 Echo 服务。"
license = "MIT"
tags = ["typescript", "wasm", "component"]

[plugin.capabilities]
network = []
filesystem = []
database = false

[[plugin.subplugins]]
id = "ts-counter-screen"
pages = ["ts-counter"]
account_actions = ["ts-counter"]

[[plugin.subplugins]]
id = "ts-echo-service"
dependencies = ["ts-counter-screen"]
routes = ["echo"]
