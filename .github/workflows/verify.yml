name: Verify plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 保存提交内发布产物
        run: cp dist/plugin.wasm "$RUNNER_TEMP/published-plugin.wasm"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 启用仓库内 pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      - name: 安装 TypeScript 依赖
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 验证 TypeScript 源码
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: 安装 Rust 工具链
        run: rustup toolchain install nightly --profile minimal

      - name: 安装 Wasm 工具
        run: cargo +nightly install wasm-tools --locked --version 1.245.1

      - name: 验证 Component ABI
        run: |
          wasm-tools validate --features component-model dist/plugin.wasm
          wasm-tools component wit dist/plugin.wasm

      - name: 恢复并验证提交内发布产物
        run: |
          cp "$RUNNER_TEMP/published-plugin.wasm" dist/plugin.wasm
          wasm-tools validate --features component-model dist/plugin.wasm
          wasm-tools component wit dist/plugin.wasm

      - name: 检出 AIO 校验器
        uses: actions/checkout@v4
        with:
          repository: zjarlin/aio
          ref: 68ab02d1b65928b011f764b114d69e9d8ed9ee20
          path: aio-host-source
          submodules: recursive

      - name: 验证 AIO 插件协议
        run: cargo +nightly run --manifest-path aio-host-source/Cargo.toml --bin aio -- plugin validate "$GITHUB_WORKSPACE"

      - name: 发布已验证的 Component
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AIO_PLUGIN_PUBLISH_URL != ''
        env:
          AIO_PLUGIN_PUBLISH_TOKEN: ${{ secrets.AIO_PLUGIN_PUBLISH_TOKEN }}
          AIO_PLUGIN_PUBLISH_URL: ${{ vars.AIO_PLUGIN_PUBLISH_URL }}
        run: |
          if [ -z "$AIO_PLUGIN_PUBLISH_TOKEN" ]; then
            exit 0
          fi
          artifact_file="$RUNNER_TEMP/plugin.wasm.base64"
          response_file="$RUNNER_TEMP/aio-publish-response.json"
          base64 --wrap=0 dist/plugin.wasm | tr -d '\n' > "$artifact_file"
          artifact_sha256="$(sha256sum dist/plugin.wasm | awk '{print $1}')"
          jq -n \
            --arg git "${{ github.server_url }}/${{ github.repository }}.git" \
            --arg rev "$GITHUB_SHA" \
            --rawfile manifest aio-plugin.toml \
            --rawfile artifact_base64 "$artifact_file" \
            --arg artifact_sha256 "$artifact_sha256" \
            '{git:$git, rev:$rev, manifest_toml:$manifest, artifact_base64:$artifact_base64, artifact_sha256:$artifact_sha256}' \
            | gzip -c \
            | curl --fail-with-body --show-error --request POST \
                --header 'content-encoding: gzip' \
                --header "authorization: Bearer $AIO_PLUGIN_PUBLISH_TOKEN" \
                --header 'content-type: application/json' \
                --data-binary @- "$AIO_PLUGIN_PUBLISH_URL" \
            | tee "$response_file"
          job_id="$(jq -er '.data.job_id' "$response_file")"
          job_url="${AIO_PLUGIN_PUBLISH_URL%/plugins/publish}/publish-jobs/$job_id"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              --header "authorization: Bearer $AIO_PLUGIN_PUBLISH_TOKEN" \
              "$job_url")"
            state="$(jq -er '.data.state' <<< "$response")"
            detail="$(jq -r '.data.detail // ""' <<< "$response")"
            case "$state" in
              active)
                printf '发布任务已激活: %s\n' "$detail"
                exit 0
                ;;
              failed)
                printf '发布任务失败: %s\n' "$detail" >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          printf '发布任务等待超时\n' >&2
          exit 1

      - name: 检出 AIO 宿主
        uses: actions/checkout@v4
        with:
          repository: zjarlin/aio-public-shell
          ref: a0fe6a430d27e88c5c7d97b6b43c83734a0c45bc
          path: aio-public-shell

      - name: 验证 Wasmtime 租户隔离
        working-directory: aio-public-shell
        run: AIO_TEST_WASM_COMPONENT="$GITHUB_WORKSPACE/dist/plugin.wasm" cargo +nightly test --no-default-features --features server activates_reuses_and_destroys_tenant_instances -- --ignored
