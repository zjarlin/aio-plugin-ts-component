name: Verify plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 保存提交内发布产物
        run: cp dist/plugin.wasm "$RUNNER_TEMP/published-plugin.wasm"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 启用仓库内 pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      - name: 安装 TypeScript 依赖
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 验证 TypeScript 源码
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: 安装 Rust 工具链
        run: rustup toolchain install nightly --profile minimal

      - name: 安装 Wasm 工具
        run: cargo +nightly install wasm-tools --locked --version 1.245.1

      - name: 验证 Component ABI
        run: |
          wasm-tools validate --features component-model dist/plugin.wasm
          wasm-tools component wit dist/plugin.wasm

      - name: 恢复并验证提交内发布产物
        run: |
          cp "$RUNNER_TEMP/published-plugin.wasm" dist/plugin.wasm
          wasm-tools validate --features component-model dist/plugin.wasm
          wasm-tools component wit dist/plugin.wasm

      - name: 检出 AIO 校验器
        uses: actions/checkout@v7
        with:
          repository: zjarlin/aio
          ref: fd343767a0e74de974d8a57abeeae06032602a82
          path: aio-host-source
          submodules: recursive

      - name: 验证 AIO 插件协议
        run: cargo +nightly run --manifest-path aio-host-source/Cargo.toml --bin aio -- plugin validate "$GITHUB_WORKSPACE"

      - name: 发布已验证的插件
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AIO_PLUGIN_PUBLISH_URL != ''
        env:
          AIO_PLUGIN_PUBLISH_TOKEN: ${{ secrets.AIO_PLUGIN_PUBLISH_TOKEN }}
          AIO_PLUGIN_PUBLISH_URL: ${{ vars.AIO_PLUGIN_PUBLISH_URL }}
        run: |
          if [ -z "$AIO_PLUGIN_PUBLISH_TOKEN" ]; then
            exit 0
          fi
          cargo +nightly run --manifest-path aio-host-source/Cargo.toml --bin aio -- plugin publish "$GITHUB_WORKSPACE"

      - name: 检出 AIO 宿主
        uses: actions/checkout@v7
        with:
          repository: zjarlin/aio-public-shell
          ref: 0a6b401ff1792059237495c8526515c1919b3805
          path: aio-public-shell

      - name: 验证 Wasmtime 租户隔离
        working-directory: aio-public-shell
        run: AIO_TEST_WASM_COMPONENT="$GITHUB_WORKSPACE/dist/plugin.wasm" cargo +nightly test --no-default-features --features server activates_reuses_and_destroys_tenant_instances -- --ignored
